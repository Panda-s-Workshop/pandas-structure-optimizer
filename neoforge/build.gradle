plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // In the dev runs common's classes and resources (data and assets) belong to the mod itself, not to a library
    // beside it: one module, no split packages. The group is named main, Loom's own name for this module: a second
    // group would give NeoForge two copies of the mod, and it may pick the one without common's files.
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

// The run folders stay at the repository root (run/client is where you play).
loom {
    runs {
        client {
            runDir "../run/client"
            property "neoforge.enabledGameTestNamespaces", "pandas_structure_optimizer"
        }
        server {
            runDir "../run/server"
            programArgs "--nogui", "--port", "25619"
        }
        // runs every GameTest and exits; non-zero exit when a required test fails
        gameTestServer {
            server()
            name "Game Test Server"
            runDir "../run/gametest"
            mainClass = "net.neoforged.fml.startup.GameTestServer"
            property "neoforge.enableGameTest", "true"
            property "neoforge.enabledGameTestNamespaces", "pandas_structure_optimizer"
        }
    }
}

// ./gradlew :neoforge:runGameTestServer -PoptTests=template_*,mod_loaded runs only those GameTests (names,
// * for any run of letters), so a change runs the tests that cover it, not all of them
if (project.hasProperty("optTests")) {
    loom {
        runs {
            gameTestServer {
                property "pandas_structure_optimizer.tests", project.property("optTests").toString()
            }
        }
    }
}


// NeoForge reads access transformers, not the widener: META-INF/accesstransformer.cfg is generated from common's widener
def accessTransformerDir = layout.buildDirectory.dir("generated/accesstransformer")
def generateAccessTransformer = tasks.register("generateAccessTransformer") {
    def widener = project(":common").file("src/main/resources/pandas_structure_optimizer.accesswidener")
    inputs.file widener
    outputs.dir accessTransformerDir
    doLast {
        def out = accessTransformerDir.get().file("META-INF/accesstransformer.cfg").asFile
        out.parentFile.mkdirs()
        def lines = ["# Generated from common/src/main/resources/pandas_structure_optimizer.accesswidener"] + accessTransformerFor(widener.readLines())
        out.text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}
sourceSets.main.resources.srcDir(generateAccessTransformer)

// access transformer lines for access widener lines: accessible is public; extendable and mutable also drop final
static List<String> accessTransformerFor(List<String> widener) {
    def out = []
    widener.each { line ->
        def parts = line.replaceAll(/#.*/, "").trim().split(/\s+/)
        if (parts.length < 3 || parts[0] == "accessWidener") return
        def modifier = parts[0] == "accessible" ? "public" : "public-f"
        def owner = parts[2].replace("/", ".")
        switch (parts[1]) {
            case "class": out << "${modifier} ${owner}".toString(); break
            case "method": out << "${modifier} ${owner} ${parts[3]}${parts[4]}".toString(); break
            case "field": out << "${modifier} ${owner} ${parts[3]}".toString(); break
        }
    }
    return out
}

processResources {
    def props = ["minecraft_version", "minecraft_version_range", "neoforge_version", "mod_name", "mod_description",
                 "mod_license", "mod_version", "mod_authors", "mod_id"].collectEntries { [(it): rootProject.property(it)] }
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

// the released jar: common and NeoForge classes together (nothing to remap since 26.1)
shadowJar {
    exclude "datapacks/**" // the test pack, for dev runs only
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge"
}

jar {
    archiveClassifier = "dev"
}

assemble.dependsOn shadowJar
